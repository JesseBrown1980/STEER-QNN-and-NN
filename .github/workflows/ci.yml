name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integer-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rust 1.81 with clippy and rustfmt
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.81.0
      - name: no float, no json, no node
        run: |
          ! grep -rnE '\bf(32|64)\b' src
          ! git ls-files | grep -iE '\.(json|js|mjs|ts)$|package\.json'
      - name: the copied big-integer module is unchanged
        run: test "$(git hash-object src/bigint.rs)" = "23f5447e352e9b8928281f341059d2f25f22bb60"
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: tests
        run: cargo test --release
      - name: filed rows and specs match their checksums
        run: |
          (cd specs && sha256sum -c SHA256SUMS --quiet)
          (cd results && sha256sum -c SHA256SUMS --quiet)
